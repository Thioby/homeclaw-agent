  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.zasilanie_macstudio_power
    below: 21
    for:
      hours: 0
      minutes: 0
      seconds: 10
  conditions: []
  actions:
  - action: switch.turn_off
    metadata: {}
    target:
      entity_id: switch.zasilanie_macstudio_usb_1
    data: {}
  mode: single
